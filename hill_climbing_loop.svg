<svg width="100%" viewBox="0 0 1000 550" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
<title>Experiment loop: Traces → Evaluate → Fix with baseline gating</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
</marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
</marker>
</defs>

<!-- Background -->
<rect width="1000" height="550" fill="#fff"/>

<!-- TRACES box (bottom-left) -->
<rect x="50" y="350" width="210" height="130" rx="12" fill="#f8f9fa" stroke="#333" stroke-width="2.5"/>
<text x="155" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">TRACES</text>
<text x="155" y="385" text-anchor="middle" font-size="13" fill="#555">collect traces / be</text>
<text x="155" y="405" text-anchor="middle" font-size="13" fill="#555">in a place where</text>
<text x="155" y="425" text-anchor="middle" font-size="13" fill="#555">traces are visible</text>

<!-- EVALUATE box (bottom-center) -->
<rect x="340" y="350" width="230" height="130" rx="12" fill="#f8f9fa" stroke="#333" stroke-width="2.5"/>
<text x="455" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">EVALUATE</text>
<text x="455" y="385" text-anchor="middle" font-size="13" fill="#555">1. Feature test</text>
<text x="455" y="408" text-anchor="middle" font-size="13" fill="#555">2. Regression tests</text>
<text x="455" y="431" text-anchor="middle" font-size="13" fill="#555">3. e2e browser/playwright</text>
<text x="455" y="454" text-anchor="middle" font-size="13" fill="#555">   tests</text>

<!-- Baseline Score box (top-center) -->
<rect x="360" y="130" width="190" height="75" rx="10" fill="#fff" stroke="#333" stroke-width="2.5"/>
<text x="455" y="163" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Baseline</text>
<text x="455" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Score</text>

<!-- Throw/Keep decision (top-left) -->
<text x="220" y="80" font-size="14" font-weight="bold" fill="#c0392b">Throw if Score &lt; Baseline</text>
<text x="220" y="103" font-size="14" font-weight="bold" fill="#27ae60">if no: Baseline = Score</text>

<!-- Hypothesis Feature #i (center-right) -->
<text x="640" y="195" font-size="15" font-weight="bold" fill="#333">Hypothesis Feature #i</text>
<text x="640" y="218" font-size="15" fill="#333">for i to N</text>

<!-- N annotation (far right) -->
<text x="650" y="80" font-size="13" fill="#666" font-style="italic">N is predecided by</text>
<text x="650" y="100" font-size="13" fill="#666" font-style="italic">Human before loop starts</text>
<text x="650" y="120" font-size="13" fill="#666" font-style="italic">or by the orchestrator</text>
<text x="650" y="140" font-size="13" fill="#666" font-style="italic">when it fans out</text>
<text x="650" y="160" font-size="13" fill="#666" font-style="italic">Explore subagents.</text>

<!-- FIX box (bottom-right) -->
<rect x="650" y="310" width="220" height="140" rx="12" fill="#f8f9fa" stroke="#333" stroke-width="2.5"/>
<text x="760" y="298" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">FIX</text>
<text x="760" y="385" text-anchor="middle" font-size="16" fill="#555">You (the agent)</text>

<!-- ARROWS -->

<!-- Traces → Evaluate (right) -->
<path d="M 260 415 L 335 415" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Evaluate → Baseline Score (up) -->
<path d="M 455 350 L 455 210" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- Keep: Baseline → Hypothesis (green, right) -->
<path d="M 550 167 L 630 200" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-green)"/>

<!-- Throw: Baseline → back to Hypothesis (red dashed, curves up and back) -->
<path d="M 360 145 C 300 80 500 40 640 185" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow-red)"/>

<!-- Hypothesis → FIX (down) -->
<path d="M 700 225 L 740 305" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- FIX → Traces (bottom curve, the main reconcile loop) -->
<path d="M 650 450 C 500 530 280 530 155 480" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

</svg>
