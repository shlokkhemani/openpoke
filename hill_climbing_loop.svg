<svg width="100%" viewBox="0 0 720 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Hill climbing machine: execution agent overload optimization loop</title>
<desc>Three-stage loop — Traces, Evaluate, Fix — showing 6 experiments across the roster, history, prompt, and batch vectors. Bottom arrow is the main Reconcile cycle; top dashed path shows hypothesis rotation when an experiment reveals a new vector.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: "Inter", "Anthropic Sans", -apple-system, system-ui, sans-serif; }
</style>
</defs>

<!-- ═══ Stage boxes ═══ -->
<g>
  <rect x="40" y="178" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="120" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Traces</text>
  <text x="120" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f6e56">Observe behavior</text>
</g>

<g>
  <rect x="268" y="178" width="174" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="355" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3c3489">Evaluate</text>
  <text x="355" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534ab7">Feature · reg · e2e</text>
</g>

<g>
  <rect x="510" y="178" width="150" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="585" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712b13">Fix</text>
  <text x="585" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993c1d">Implement &amp; measure</text>
</g>

<!-- ═══ Forward arrows ═══ -->
<line x1="200" y1="206" x2="266" y2="206" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="442" y1="206" x2="508" y2="206" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ═══ Reconcile (bottom loop) ═══ -->
<path d="M 585 234 V 296 Q 585 308 573 308 H 132 Q 120 308 120 296 V 234" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="355" y="302" text-anchor="middle" font-size="12" fill="#52514e">Reconcile</text>

<!-- ═══ Rotate (top dashed arc) ═══ -->
<path d="M 355 178 V 72 Q 355 62 365 62 H 575 Q 585 62 585 72 V 176" fill="none" stroke="#52514e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="346" y="100" text-anchor="end" font-size="12" fill="#52514e">Rotate to different</text>
<text x="346" y="116" text-anchor="end" font-size="12" fill="#52514e">experiment</text>
<text x="596" y="100" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">Hypothesis</text>
<text x="596" y="116" text-anchor="start" font-size="12" fill="#52514e">Next vector</text>

<!-- ═══ Experiment timeline (bottom section) ═══ -->
<line x1="40" y1="345" x2="680" y2="345" stroke="#d4d3d0" stroke-width="0.5"/>
<text x="40" y="340" font-size="11" font-weight="500" fill="#52514e">EXPERIMENTS</text>

<!-- Exp 1-3: Roster -->
<rect x="40" y="355" width="100" height="22" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="90" y="370" text-anchor="middle" font-size="9" font-weight="500" fill="#085041">1-3 Roster</text>

<!-- Exp 4: History -->
<rect x="150" y="355" width="100" height="22" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="200" y="370" text-anchor="middle" font-size="9" font-weight="500" fill="#3c3489">4 History cap</text>

<!-- Exp 5: Prompt budget -->
<rect x="260" y="355" width="110" height="22" rx="4" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="315" y="370" text-anchor="middle" font-size="9" font-weight="500" fill="#712b13">5 Prompt budget</text>

<!-- Exp 6: Batch compact -->
<rect x="380" y="355" width="110" height="22" rx="4" fill="#fef6e7" stroke="#b08215" stroke-width="0.5"/>
<text x="435" y="370" text-anchor="middle" font-size="9" font-weight="500" fill="#7a5a0e">6 Batch compact</text>

<!-- Result badge -->
<rect x="520" y="355" width="140" height="22" rx="4" fill="#085041" stroke="none"/>
<text x="590" y="370" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">60% total reduction</text>

<!-- ═══ Annotations showing loop in action ═══ -->
<text x="120" y="260" text-anchor="middle" font-size="9" fill="#0f6e56">roster.json</text>
<text x="120" y="272" text-anchor="middle" font-size="9" fill="#0f6e56">log sizes</text>
<text x="355" y="260" text-anchor="middle" font-size="9" fill="#534ab7">unit + E2E</text>
<text x="355" y="272" text-anchor="middle" font-size="9" fill="#534ab7">token counts</text>
<text x="585" y="260" text-anchor="middle" font-size="9" fill="#993c1d">code changes</text>
<text x="585" y="272" text-anchor="middle" font-size="9" fill="#993c1d">live deploy</text>

<!-- Rotation annotations -->
<text x="470" y="50" text-anchor="middle" font-size="9" fill="#89878129" font-style="italic">Exp 1→3: "completed agents</text>
<text x="470" y="62" text-anchor="middle" font-size="9" fill="#89878129" font-style="italic">still needed for reuse"</text>

</svg>
